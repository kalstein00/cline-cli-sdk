<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cline Chat · SDK 소비 앱</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.mjs"></script></head>
<body>
<aside><a class="brand" href="/">Cline <span>Chat</span></a><p class="subtle">SDK를 사용하는 독립 소비 앱</p>
<button id="new" disabled>＋ 새 대화</button><button id="list" disabled>목록 갱신</button><nav id="conversations" aria-label="대화 목록"><p class="subtle">첫 메시지를 보내 대화를 시작하세요.</p></nav>
<footer>공개 CLI 기준선<br>회사 호환성 미검증</footer></aside>
<main><header><div><h1 id="title">새 대화</h1><p id="status">연결 설정을 확인하세요.</p></div><span id="connection">연결 전</span></header>
<details id="settings" open><summary>연결 설정</summary><form id="connectForm"><div class="fields">
<label>SSH 별칭<input id="host" value="wsl" required autocomplete="off"></label>
<label>CLI 경로<input id="cliPath" placeholder="/absolute/path/to/cline" autocomplete="off"></label>
<label>관리 디렉터리<input id="remoteRoot" placeholder="/remote/sdk-control" autocomplete="off"></label>
<label>SSH 키 파일 경로 (선택)<input id="identityFile" autocomplete="off"></label>
<label>작업 디렉터리<input id="cwd" required placeholder="/remote/workspace" autocomplete="off"></label>
<label>CLI 데이터 디렉터리<input id="dataDir" placeholder="/remote/isolated-data" autocomplete="off"></label>
</div><button id="connect" type="submit">연결 확인</button><p id="preflight" role="status"></p></form></details>
<div id="error" role="alert" hidden></div>
<section id="timeline" aria-label="메시지 내역"><div id="empty"><h2>무엇을 도와드릴까요?</h2><p>원격 Cline에 요청을 보내고 대화로 결과를 확인하세요.</p></div><div id="messages"></div><section id="interactions" aria-label="질문과 승인"></section></section>
<button id="newMessages" hidden>새 메시지 보기 ↓</button>
<form id="composer"><div id="pending" role="status" hidden></div><label id="composerLabel" for="message">메시지</label>
<textarea id="message" rows="2" placeholder="Cline에 요청할 내용을 입력하세요." autocomplete="off"></textarea>
<div class="compose-footer"><small id="hint">연결 확인 후 첫 메시지를 보낼 수 있습니다.</small><button id="send" disabled>첫 메시지 보내기</button></div></form>
</main></body></html>
